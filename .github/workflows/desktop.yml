name: desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux deb
            artifact: release/*.deb
          - os: windows-latest
            target: --win nsis
            artifact: release/*.exe
          - os: macos-latest
            target: --mac dmg
            artifact: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron 45 has no postinstall script; the binary is fetched by its own installer. The Linux
      # smoke run needs it, and `pnpm install` alone leaves `node_modules/electron/dist` empty.
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - run: pnpm build
      - name: Smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm app:smoke
      - name: Package
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: omnihilbras-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      # `latest*.yml` is what electron-updater reads. A release without it makes every installed
      # app fail its update check with "Cannot find latest yml in the latest release artifacts".
      - name: Attach assets to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}
            release/latest*.yml
            release/*.blockmap
          fail_on_unmatched_files: false
          generate_release_notes: true
