name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # The image is published under the project's name, so a tag off main must not reach the registry. This is the
  # same gate the desktop workflow uses; without it a write-holder can push a tag at any commit and ship it.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit must be an ancestor of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of main. Publish from main."
            exit 1
          fi
          echo "$GITHUB_SHA is on main."

  build-and-push:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # GHCR rejects an uppercase tag, and `github.repository` is `Hilbras/OmniHilbras`: the build failed with
      # `invalid tag "ghcr.io/Hilbras/OmniHilbras:latest"` before a single layer was compiled, on every tag this
      # workflow has ever run for. Lowercase once, here, rather than typing a name that has to be kept in step.
      - name: The image name is lowercased, because a tag may not carry a capital
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
