# Every check that must pass before a change lands.
#
# There was no CI at all, which meant the 419 tests only ever ran when I happened to run them.
# That is not a safety net, it is a habit — and a habit does not run on someone else's machine,
# or on a machine that is too loaded to be paying attention.
name: verify
on:
  push:
    branches: [main]
  pull_request:
# Read-only, and the token is not left in .git/config. This job runs `pnpm verify`, which executes
# tests/*.test.js — files a pull request author writes — so a persisted token would be a credential
# sitting in the same working tree as untrusted code.
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The version check compares the tree against the latest tag, so it needs the history
          # and the tags. A shallow clone would make it silently skip the comparison.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The canonical command, so CI cannot check less than `pnpm verify` does locally. It runs the
      # version check, brand check, typecheck, tests, build and bundle analysis in that order.
      - name: Verify
        run: pnpm verify
